[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "noisefloor"
version = "0.1.0"
description = "Measure an LLM judge's retest variance before you trust its deltas."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Christopher MacGregor"}]
keywords = ["llm", "evaluation", "llm-as-judge", "reliability", "icc", "noise"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["noisefloor"]

[project.scripts]
noisefloor = "noisefloor.cli:main"

[project.urls]
Source = "https://github.com/GreatPyreneseDad/noisefloor"
